name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Run smoke pipeline
        run: python -m src.pipeline --rows 10000 --seed 42

      - name: Verify generated outputs
        run: python -m src.verify_outputs

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: |
            reports/
            logs/
          retention-days: 7
